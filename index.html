<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Regime D | Trading Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b1020;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont,
        "Helvetica Neue", Arial, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 24px 16px 60px;
    }

    .header {
      margin-bottom: 28px;
    }

    .eyebrow {
      color: #94a3b8;
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: 700;
    }

    h1 {
      font-size: 27px;
      margin: 10px 0;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.7;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 8px;
      background: #1e293b;
      color: #cbd5e1;
      font-size: 11px;
      margin-top: 8px;
    }

    .card {
      background: #151e30;
      border: 1px solid #263349;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 14px;
    }

    .label {
      color: #94a3b8;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .balance {
      font-size: clamp(30px, 8vw, 42px);
      font-weight: 750;
      letter-spacing: -1px;
    }

    .profit {
      font-size: 20px;
      font-weight: 700;
      margin-top: 12px;
    }

    .positive {
      color: #4ade80;
    }

    .negative {
      color: #fb7185;
    }

    .neutral {
      color: #cbd5e1;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .grid .card {
      margin-bottom: 0;
      padding: 18px;
    }

    .value {
      font-size: 21px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .section-title {
      font-size: 17px;
      font-weight: 700;
      margin: 30px 0 14px;
    }

    .chart {
      width: 100%;
      display: block;
      border-radius: 10px;
    }

    .status {
      display: inline-block;
      border-radius: 8px;
      padding: 7px 12px;
      background: #263349;
      font-size: 13px;
      font-weight: 700;
    }

    .footer {
      color: #64748b;
      font-size: 11px;
      line-height: 1.8;
      margin-top: 28px;
      text-align: center;
    }

    .error {
      color: #fbbf24;
      font-size: 13px;
      line-height: 1.7;
    }

    @media (min-width: 650px) {
      .grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="header">
      <div class="eyebrow">PAPER TRADING / REGIME D</div>
      <h1>Trading Dashboard</h1>
      <div class="subtitle">
        BTC市場判定 × ETH売買戦略<br>
        仮想運用パフォーマンス
      </div>
      <div class="badge" id="updated">データ読み込み中...</div>
    </header>

    <section class="card">
      <div class="label">現在の評価資産</div>
      <div class="balance" id="equity">-- 円</div>
      <div class="profit neutral" id="profit">-- 円</div>
      <div class="subtitle" id="return">累計リターン --%</div>
    </section>

    <section class="grid">
      <div class="card">
        <div class="label">勝率</div>
        <div class="value" id="winRate">--%</div>
      </div>

      <div class="card">
        <div class="label">完了取引</div>
        <div class="value" id="trades">-- 回</div>
      </div>

      <div class="card">
        <div class="label">最大DD</div>
        <div class="value" id="drawdown">--%</div>
      </div>

      <div class="card">
        <div class="label">ETH保有量</div>
        <div class="value" id="ethQty">--</div>
      </div>
    </section>

    <h2 class="section-title">資産推移</h2>

    <section class="card">
      <img
        class="chart"
        id="equityChart"
        alt="資産推移グラフ"
        style="display:none"
      >
      <div class="subtitle" id="chartMessage">
        グラフを読み込み中...
      </div>
    </section>

    <h2 class="section-title">最新の売買状況</h2>

    <section class="card">
      <div class="label">売買アクション</div>
      <div class="status" id="action">--</div>

      <div class="label" style="margin-top:22px">
        市場判定 / 使用戦略
      </div>
      <div class="value" id="strategy">--</div>

      <div class="subtitle" style="margin-top:12px" id="signal">
        シグナル：--
      </div>
    </section>

    <div class="error" id="error"></div>

    <footer class="footer">
      BTC / ETH REGIME D<br>
      Simulation only · No real orders<br>
      公開ページのため認証情報は掲載しません
    </footer>

  </main>

  <script>
    const INITIAL_CASH = 50000;

    const yen = value =>
      Number(value).toLocaleString("ja-JP", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }) + " 円";

    const percent = value =>
      Number(value).toFixed(3) + "%";

    function setText(id, value) {
      document.getElementById(id).textContent = value;
    }

    async function loadDashboard() {
      try {
        const response = await fetch(
          "./data.json?t=" + Date.now(),
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error("data.json がまだありません");
        }

        const data = await response.json();

        const equity = Number(data.equity);
        const profit = equity - INITIAL_CASH;
        const returnPct = profit / INITIAL_CASH * 100;

        setText("equity", yen(equity));

        setText(
          "profit",
          (profit >= 0 ? "+" : "") + yen(profit)
        );

        setText(
          "return",
          "累計リターン " +
          (returnPct >= 0 ? "+" : "") +
          percent(returnPct)
        );

        document.getElementById("profit").className =
          "profit " + (
            profit > 0 ? "positive" :
            profit < 0 ? "negative" : "neutral"
          );

        setText("winRate", percent(data.win_rate));
        setText("trades", data.completed_trades + " 回");
        setText("drawdown", percent(data.max_drawdown));
        setText(
          "ethQty",
          Number(data.eth_qty).toFixed(6) + " ETH"
        );

        setText("updated", "最終記録日：" + data.date);
        setText("action", data.action || "--");

        setText(
          "strategy",
          (data.regime || "--") +
          " / " +
          (data.strategy || "--")
        );

        setText(
          "signal",
          "シグナル：" + data.signal
        );

      } catch (error) {
        setText(
          "error",
          "データの読み込みに失敗しました：" +
          error.message
        );
        setText("updated", "データ未接続");
      }

      const chart = document.getElementById("equityChart");

      chart.onload = () => {
        chart.style.display = "block";
        setText("chartMessage", "");
      };

      chart.onerror = () => {
        chart.style.display = "none";
        setText("chartMessage", "グラフはまだありません");
      };

      chart.src = "./chart.png?t=" + Date.now();
    }

    loadDashboard();
  </script>
</body>
</html>
